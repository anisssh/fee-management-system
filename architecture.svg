<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fee management system architecture</title>
<desc>Students and admins call API Management, which forwards to an Azure Functions app backed by Azure SQL. Entra ID validates admin identity for the Functions app, and the Functions app sends reminder emails via SendGrid.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="40" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="105" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Student / admin</text>
<text x="105" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Client calls</text>

<rect x="190" y="40" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="265" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">API Management</text>
<text x="265" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">Key + rate limit</text>

<rect x="360" y="40" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="435" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Function app</text>
<text x="435" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">API + automation</text>

<rect x="530" y="40" width="110" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="585" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Azure SQL</text>
<text x="585" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Fee records</text>

<line x1="170" y1="68" x2="188" y2="68" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="68" x2="358" y2="68" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="510" y1="68" x2="528" y2="68" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="360" y="180" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="435" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Entra ID</text>
<text x="435" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">JWT + roles</text>

<rect x="530" y="180" width="110" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="585" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">SendGrid</text>
<text x="585" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">Reminders</text>

<line x1="435" y1="178" x2="435" y2="98" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M460 96 L460 140 L585 140 L585 178" fill="none" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

</svg>